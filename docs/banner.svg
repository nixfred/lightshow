<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="LightShow - keyboard RGB control for Linux">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0c12"/>
      <stop offset="55%"  stop-color="#141830"/>
      <stop offset="100%" stop-color="#1d1030"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7aa2f7"/>
      <stop offset="40%"  stop-color="#bb9af7"/>
      <stop offset="72%"  stop-color="#ff7ac6"/>
      <stop offset="100%" stop-color="#ff9e64"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="keyglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- ambient wash, echoing the four zones -->
  <g filter="url(#soft)" opacity=".40">
    <ellipse cx="250" cy="215" rx="150" ry="60" fill="#7aa2f7"/>
    <ellipse cx="560" cy="225" rx="190" ry="60" fill="#bb9af7"/>
    <ellipse cx="830" cy="215" rx="120" ry="55" fill="#ff7ac6"/>
    <ellipse cx="1000" cy="215" rx="100" ry="50" fill="#ff9e64"/>
  </g>

  <text x="600" y="118" text-anchor="middle"
        font-family="JetBrains Mono, DejaVu Sans Mono, monospace"
        font-size="72" font-weight="800" letter-spacing="14"
        fill="url(#word)">LIGHTSHOW</text>

  <text x="600" y="152" text-anchor="middle"
        font-family="JetBrains Mono, DejaVu Sans Mono, monospace"
        font-size="15" letter-spacing="6" fill="#8892b0">
    KEYBOARD RGB CONTROL FOR LINUX
  </text>

  <!-- the keyboard, drawn as the four zone groups the hardware exposes -->
  <g transform="translate(215,182)">
    <path d="M0 0 H770 V84 L752 102 H-18 V18 Z" fill="#0e1018" stroke="#2b3048" stroke-width="2"/>
    <g filter="url(#keyglow)">
      <rect x="18"  y="18" width="104" height="66" rx="6" fill="#7aa2f7"/>
      <rect x="134" y="18" width="330" height="66" rx="6" fill="#bb9af7"/>
      <rect x="476" y="18" width="112" height="66" rx="6" fill="#ff7ac6"/>
      <rect x="600" y="18" width="152" height="66" rx="6" fill="#ff9e64" opacity=".9"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="11" font-weight="700"
       fill="#0b0c12" opacity=".72" text-anchor="middle">
      <text x="70"  y="56">WASD</text>
      <text x="299" y="56">MAIN BLOCK</text>
      <text x="532" y="56">NAV</text>
      <text x="676" y="56">NUMPAD</text>
    </g>
  </g>
</svg>
