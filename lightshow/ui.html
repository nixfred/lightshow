<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LightShow for Omarchy</title>
<style>
  :root{
    --bg:#0b0c12; --panel:#12141d; --panel2:#171a26; --line:#242838;
    --fg:#c8cfe6; --dim:#6b748f; --accent:#7aa2f7; --accent2:#bb9af7;
    --chamfer:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:
      radial-gradient(900px 500px at 15% -10%, #1b2140 0%, transparent 60%),
      radial-gradient(700px 400px at 95% 0%, #2a1440 0%, transparent 55%),
      var(--bg);
    color:var(--fg); font:14px/1.5 "JetBrains Mono","Fira Code",ui-monospace,monospace;
    height:100vh; overflow:hidden; padding:14px 16px;
  }
  /* The page never scrolls. One column: the colours on the keys, the theme
     palette they come from, and the effects. Nothing else to set. */
  .wrap{max-width:1400px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px}
  /* The Omarchy chamfer: a bevelled corner, used on every surface. */
  .cham{clip-path:polygon(var(--chamfer) 0,100% 0,100% calc(100% - var(--chamfer)),calc(100% - var(--chamfer)) 100%,0 100%,0 var(--chamfer))}

  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:22px;margin:0;letter-spacing:.16em;text-transform:uppercase;
     background:linear-gradient(92deg,var(--accent),var(--accent2) 60%,#ff7ac6);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 0 34px rgba(122,162,247,.25)}
  .meta{color:var(--dim);font-size:12px}
  .meta b{color:var(--accent);font-weight:500}

  section{background:var(--panel);border:1px solid var(--line);padding:16px;margin:0}
  h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
     margin:0 0 12px;font-weight:600}

  /* live zone preview */
  .kbd{display:grid;grid-template-columns:1fr 2.2fr 1fr 1.2fr;gap:8px;margin-bottom:12px}
  .zone{height:78px;border:1px solid var(--line);display:flex;flex-direction:column;
        justify-content:flex-end;padding:8px;position:relative;overflow:hidden;
        transition:background .12s linear,box-shadow .12s linear}
  .zone span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
             color:#0009;font-weight:700;mix-blend-mode:difference;filter:invert(1)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
  .fx{background:var(--panel2);border:1px solid var(--line);padding:11px 12px;
      cursor:pointer;text-align:left;color:var(--fg);font:inherit;transition:.14s}
  .fx:hover{border-color:var(--accent);transform:translateY(-2px);
            box-shadow:0 8px 22px -10px var(--accent)}
  .fx.on{border-color:var(--accent);background:linear-gradient(150deg,#1d2440,#171a26);
         box-shadow:0 0 0 1px var(--accent),0 10px 30px -12px var(--accent)}
  .fx .n{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
  .fx .d{color:var(--dim);font-size:11px;margin-top:3px;line-height:1.35}
  .fx .k{font-size:9px;color:var(--accent2);letter-spacing:.14em;margin-top:6px;
         text-transform:uppercase;opacity:.75}

  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  label{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .sw{width:22px;height:22px;border:1px solid #0006}
  .swatches{display:flex;flex-wrap:wrap;gap:5px}
  .note{color:var(--dim);font-size:11px;line-height:1.5;margin-top:10px;
        border-left:2px solid var(--line);padding-left:10px}
  /* one line per connected keyboard; a warning when it cannot do everything */
  .boards{margin-top:10px;display:flex;flex-direction:column;gap:3px;font-size:11px}
  .boards b{color:var(--fg);font-weight:600}
  .boards .warn{color:#e0af68}
  .fx:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>LightShow</h1>
    <div class="meta">
      for Omarchy &nbsp;·&nbsp; theme <b id="theme">…</b>
      &nbsp;·&nbsp; <span id="device">…</span>
    </div>
  </header>

  <section class="cham" title="The four zone groups both keyboards are driven in. This is what the keys show right now.">
    <h2>On the keys now</h2>
    <div class="kbd">
      <div class="zone cham" id="z0"><span>WASD</span></div>
      <div class="zone cham" id="z1"><span>Main block</span></div>
      <div class="zone cham" id="z2"><span>Nav / arrows</span></div>
      <div class="zone cham" id="z3"><span>Numpad / strip</span></div>
    </div>
    <div class="row">
      <label>Theme palette</label>
      <div class="swatches" id="palette"></div>
    </div>
    <div class="note" id="themeNote"></div>
    <div class="boards" id="boards"></div>
  </section>

  <section class="cham">
    <h2>Effects</h2>
    <div class="grid" id="fx"></div>
  </section>

</div>

<script>
let S = null;           // last server snapshot
let local = {};         // the current look

const $ = id => document.getElementById(id);

async function api(path, body){
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

async function refresh(){
  S = await api('/api/state');
  local = Object.assign({}, S.current);
  render();
}

function push(patch){
  Object.assign(local, patch);
  api('/api/apply', local).then(r => { if(r.current){ local = r.current; } render(); });
}

// ---- rendering -------------------------------------------------------

function render(){
  $('theme').textContent = S.theme;
  $('device').textContent = S.device || 'no device';

  const fx = $('fx'); fx.innerHTML = '';
  S.effects.forEach(e => {
    const b = document.createElement('button');
    b.className = 'fx cham' + (e.name === local.effect ? ' on' : '');
    b.innerHTML = `<div class="n">${e.name}</div><div class="d">${e.desc}</div>
                   <div class="k">${e.kind}</div>`;
    // Greyed only when no connected keyboard can show anything for it; the
    // tooltip names any board that shows it reduced.
    b.disabled = !!e.greyed;
    const limits = Object.entries(e.fidelity || {}).filter(([, f]) => f !== 'full')
      .map(([name, f]) => name + ': ' + (f === 'none' ? 'not shown' : 'reduced'));
    b.title = e.desc + (limits.length ? '\n' + limits.join('\n') : '');
    b.onclick = () => push({effect: e.name});
    fx.appendChild(b);
  });

  const bl = $('boards'); bl.innerHTML = '';
  (S.boards || []).forEach(b => {
    const d = document.createElement('div');
    d.innerHTML = '<b></b> ' + (b.notice ? '<span class="warn"></span>' : '<span></span>');
    d.querySelector('b').textContent = b.name;
    d.querySelector('span').textContent = b.notice ? '⚠ ' + b.notice : b.caps.summary;
    d.title = b.node;
    bl.appendChild(d);
  });

  const pal = $('palette'); pal.innerHTML = '';
  Object.entries(S.theme_palette || {}).forEach(([name, hex]) => {
    const d = document.createElement('div');
    d.className = 'sw cham'; d.style.background = hex; d.title = name + ' ' + hex;
    pal.appendChild(d);
  });
  $('themeNote').textContent = 'Every look uses ' + S.theme + "'s colours. Switch your Omarchy theme and both keyboards follow.";

  paintPreview(S.frame || S.resolved_colors);
}

// The preview mirrors the daemon: /api/frame is the last frame written to the
// keys, polled a few times a second while the page has focus.
function paintPreview(cols){
  for(let i=0;i<4;i++){
    const el = $('z'+i);
    const c = cols[i % cols.length] || '#222';
    el.style.background = c;
    el.style.boxShadow = 'inset 0 0 40px -6px #000, 0 0 26px -8px ' + c;
  }
}
async function pollFrame(){
  if(!document.hasFocus()) return;
  try { const r = await api('/api/frame'); if(r.frame) paintPreview(r.frame); } catch(e) {}
}

refresh();
setInterval(pollFrame, 200);
setInterval(() => { if(document.hasFocus()) refresh(); }, 15000);
</script>
</body>
</html>
